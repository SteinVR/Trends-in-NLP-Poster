[project]
name = "agentic-rag-challenge"
version = "0.1.0"
description = "Page-aware legal RAG pipeline and controlled component study"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pymupdf>=1.25",
    "qdrant-client>=1.13",
    "rank-bm25>=0.2",
    "transformers>=4.50",
    "torch>=2.5",
    "accelerate>=1.0",
    "sentence-transformers>=4.0",
    "numpy>=1.26",
    "opendataloader-pdf[hybrid]>=2.3.0",
    "chardet>=5,<6",
]

[project.scripts]
agentic-rag = "src.main:main"

[project.optional-dependencies]
paddle = [
    "paddleocr>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["src/resources/**/*.yaml", "src/resources/**/*.md"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that exercise cross-module orchestration or persisted artifacts",
    "slow: tests that exercise OCR/Paddle or materially slower end-to-end flows",
]
